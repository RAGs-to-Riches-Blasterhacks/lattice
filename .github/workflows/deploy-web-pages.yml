name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/Web/**'
      - 'Frontend/Flutter/**'
      - '.github/workflows/deploy-web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: Frontend/Flutter
        run: flutter pub get

      - name: Build debug APK
        working-directory: Frontend/Flutter
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lattice-apk
          path: Frontend/Flutter/build/app/outputs/flutter-apk/app-debug.apk

  build-web:
    needs: build-apk
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: lattice-apk
          path: Frontend/Web/public

      - name: Rename APK
        run: mv public/app-debug.apk public/lattice.apk

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/Web/dist

  deploy:
    needs: build-web
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
