name: lattice
description: Lattice Flutter application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  go_router: ^14.0.0
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - lib/mock-data/
    - assets/LOGO.png
    - assets/Profile.svg